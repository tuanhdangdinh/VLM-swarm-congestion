#   south of the 1.10 m south gap's) and N-S straight down the
#   inter-island corridor (x = -0.25, its centreline), so the busiest
#   conflicts are axis-aligned. This is the grounding-driven iteration
#   (MC gate block below): M3's dynamic view snaps headings within 30 deg of
#   an axis and REFUSES the rest (dynamic_arms:ambiguous), and the first
#   S1b layout (Wp/Wm at y +-1.2, N/S at (0.05, +-1.55), diagonal routes)
#   lost 46 % of first conflicts to that branch.
#   All inside the S1a node envelope (|x| <= 2.3, |y| <= 1.55), off the
#   band corners, >= 0.20 m inside every band edge (Wp/Wm against the west
#   wall, as S1a's E sits 0.2 m inside |x| = 2.5) and >= 0.60 m from both
#   islands; none at marker 1's STALE pose (-1.75, 0). Every pairwise node
#   distance >= 2.05 m (4.6x the 0.45 m latch, 4.1x M5's 0.5 m arrival /
#   M3's handoff radius), so no node sits in another's handoff radius.
# Grid-router legs (m; NavFn-like Dijkstra on the inflated costmap):
#   Wp-N 2.05  Wm-S 2.05  N-S 2.70  Wp-Wm 2.70 (forbidden)  E-N 2.89-2.91
#   E-S 2.91-2.96  S-Wp 3.57  N-Wm 3.68  E-Wp 4.85-4.95  E-Wm 4.93-5.02
#   (direction-dependent by <= 0.10 m: string-pulled grid paths)
# Shared corridors (>= 3 node-pair routes traverse the gap end to end, no
#   endpoint inside it; scripts/s1b_layout.py routes_through_gaps):
#     island_w <-> north wall (0.90 m): N-Wp, N-Wm, E-Wp
#     island_w <-> south wall (1.10 m): S-Wp, S-Wm, E-Wm
#     west wall <-> island_w  (1.20 m): N-Wm, S-Wp (+ the forbidden Wp-Wm)
#     island_e <-> north / south wall: E-Wp, E-N / E-Wm, E-S
#     island_w <-> island_e   (1.00 m): N-S
# Forbidden leg Wp<->Wm KEPT, for ONE reason only: keeping S1a's labels AND
#   forbidden list makes every seed draw the identical start assignment and
#   25-task stream on both floors, so the regime axis is paired by seed. It
#   is NOT a geometric necessity here (S1a's reason, a 0.70 m leg crossing
#   the occupant's latch radius after 0.25 m, does not arise: the S1b leg
#   is 2.70 m and clears the Delta floor below). Cost: one of the ten node
#   pairs (two west-wall nodes) is never drawn. Dropping it is a one-line
#   change (forbidden_legs: []) that breaks the pairing and regenerates
#   every seed's draw.
#
# Release stagger Delta = 2.5 sim-s (R3.6a "the release stagger Delta and
# its feasibility bound are recomputed for the new layout"; S1a's 4.0 is
# geometry-specific). With N_A = N_G every node is occupied at t = 0; the
# first-released robot must not reach a node whose occupant is still held:
#   4 Delta < (L_min - 0.45) / v = (2.05 - 0.45) / 0.15 = 10.67 sim-s
#   -> Delta < 2.67 sim-s (L_min over the allowed legs: Wp-N / Wm-S).
#   Delta = 2.5 = 0.94 of the bound (S1a: 4.0 = 0.90 of 4.42). Measured,
#   not just bounded (scripts/s1_mc.py, 400 draws): first conflicts that
#   are an arriver meeting a not-yet-released occupant (the Delta artifact)
#   = 0/400 at Delta = 2.5. On the S1b islands S1a's Delta = 4.0 gave 41/400
#   (10.3 %, first layout), so 4.0 is NOT usable on this floor: the brief's
#   "sim stagger 4.0" is superseded by R3.6a's recompute rule, and the
#   regime axis therefore differs in Delta too (S1a 4.0 / S1b 2.5).
