# Overlay FRAGMENT for the M4 command bus (2026-11-15 execution-side stall
# abort; docs/reports/2026-11-15-m4-stall-abort.md). Not a complete
# safety.yaml: an experiment kit merges this one block into the safety file it
# installs (ros2_ws/src/swarm_execution/config/safety.yaml or
# config/safety/safety_floor020.yaml), leaving every other key byte-identical.
# Neither pinned file is edited. Absent, or `enabled` anything other than a
# YAML `true` = the 68e67b5 behaviour.
#
# With it on, each raw-cmd_vel primitive (backup, pull-off sidestep, escort)
# is aborted when the command it publishes (zero while the robot is under a
# safety hold) is not matched by /odom progress: FAILED with a
# `stall_abort: ...` detail, a zero twist, and one `stall abort robot=...`
# WARN line. All times are sim seconds (node clock under use_sim_time and
# odometry header stamps).
#
# Assert it per episode from the command bus startup line
# (`Command bus started. stall_abort=True window_s=3.0 ...`), not from the
# yaml: the loader falls back to off on a read error.
# tests/unit/test_stall_abort_node.py pins this file to the code defaults.
#
# Parameters (derivation in the report, section 4):
#   window_s 3.0            progress window
#   min_progress_ratio 0.25 normal >= 0.85 (travel) / >= 0.64 (turns);
#                           pinned plateaus <= 0.09
#   grace_s 1.5             recorded ramp to 0.08 m/s <= 0.61 s
#   stale_input_s 1.0       recorded odometry period 0.033 s
#   min_linear_mps 0.03     primitives command 0.10 m/s
#   min_angular_radps 0.15  primitives command 0.50 rad/s
#   min_expected_m 0.06     floors below which a window is not judged
#   min_expected_rad 0.3
safety:
  stall_abort:
    enabled: true
    window_s: 3.0
    min_progress_ratio: 0.25
    grace_s: 1.5
    stale_input_s: 1.0
    min_linear_mps: 0.03
    min_angular_radps: 0.15
    min_expected_m: 0.06
    min_expected_rad: 0.3
