schema_version: 1
name: convoy_counterflow
family: convoy
seed: 42
# Predicted oracle makespan ~190 sim-s (robot_2 backs up and holds, then
# robot_1, robot_3 and robot_4 are escorted in turn and robot_2 returns);
# + 70 s margin (constraint C10). At RTF 0.21 an episode is ~1,240 wall-s.
duration_sec: 260.0

# B3 convoy counterflow (unified scene design docs/superpowers/specs/
# 2026-09-29-unified-scene-design.md, "B3"; amendments item 28; first to slip
# to v2 if the freeze is threatened). Real-world counterpart: a wave-released
# platoon of three same-direction AMRs meets one counter-flow robot at a
# single-lane corridor. A T2b extension on the same A55-J gate (C55 0.55 x
# 1.0 m barrier at x = 0) with legacy grounding, the tier-scoped apparatus
# difference T2b already registers. robot_1 leads the eastbound platoon,
# robot_3 and robot_4 queue behind it on the centreline, held; robot_2 is the
# counter-flow robot. Correct: one yield by robot_2, then the platoon nose to
# tail. A `convoy` answer and "yield robot_2 + platoon order" execute
# identically (M3's convoy alias); the label is scored separately.
#
# Geometry (tests/unit/test_convoy_counterflow_scenario.py pins every number
# with M3's and Arm B's own functions):
#   - robot_1 (-1.2, 0, 0) -> (2.45, -0.30); robot_2 (1.2, 0, pi) ->
#     (-2.00, 0.00); robot_3 (-1.90, 0, 0) -> (2.45, +0.30), held;
#     robot_4 (-2.47, 0, 0) -> (1.85, 0.00), held. All cross_narrow_aisle.
#   - Queue spacing: robot_1-robot_3 0.70 m, robot_3-robot_4 0.57 m (the
#     R-QUEUE-2 floor); robot_4 at x -2.47 sits 0.03 m inside the tracked
#     band. The queue is pinned as far west as the band allows: 0.1 m east
#     makes Arm B's crowding flips worse (18/45).
#   - Grounded oracle (legacy, positions): robot_2 backs up 1.00-1.08 m to
#     park x 1.124, lateral 0.36; robot_1 / robot_3 / robot_4 escorts
#     1.89-1.97 / 3.674 / 4.244 m, every escort ending at x = 1.774, 0.74 m
#     from the (2.45, +-0.3) goals. (The design doc's 3.574 / 4.174 were
#     computed from the rejected queue 0.1 m east; its 190 sim-s makespan
#     grows by ~2 s.)
#   - robot_2's goal (-2.0, 0) is 0.1 m from robot_3's spawn: robot_2 only
#     returns once robot_4 (admitted after robot_3 clears) has cleared, so
#     robot_3 has left its spawn long before robot_2 can arrive.
#   - Arm B: head_on (robot_1, robot_2), yield, nominal robot_2 (FCFS full
#     tie), crossing_order null, over 35/45 of the standoff grid; the other
#     10/45 (robot_3 within r_conflict of robot_1) read blocked_path
#     [robot_3] without the held-robot exclusion and unknown [robot_1,
#     robot_2] with it. Any answer that omits the queued robots ends in the
#     permanent bystander latch (released robot_3 passes the parked robot_2
#     at lateral 0.36 < 0.45): Arm B's executed outcome is censored by
#     construction.
#
# Timing (4 stacks, RTF 0.19-0.26; M5 starts at ~20 sim-s). The standoff forms
# at ~27 sim-s, the trigger 2.3-3.1 sim-s later (39-49 wall-s after M5
# starts), dispatch by ~75 wall-s. Hold-back D = 120 wall-s releases robot_3
# and robot_4 at 20 + RTF * 120 = 43-51 sim-s: after dispatch (both under
# linked waits) and before robot_3's admission (~70 sim-s).
#
# M5 settings, set by hand in swarm_orchestrator/config/orchestrator.yaml
# before a run (the goal table there lists them; M5 does not read this file):
#   - initial_tasks: robot_1 [2.45, -0.3], robot_2 [-2.0, 0.0], robot_3
#     [2.45, 0.3] and robot_4 [1.85, 0.0], both with start_delay_sec: 120
#     (all cross_narrow_aisle).
#   - scenario_geometry.corridor: center_m 0.0, half_length_m 0.5 (the T2b
#     A55-J edit); config/rag.yaml grounding.mode legacy (no stage 2).
#   - static_obstacles absent; prompt_static_obstacles false;
#     shadow_classical_zones []; t0_probe_mode false.
#   - scripts/vm/fc_launch.sh with the four-stack lifecycle gate (build item
#     2, not yet landed): 3 of 8 four-stack bring-ups failed without it.
robots:
  - robot_id: robot_1
    marker_id: 1
    spawn: {x: -1.2, y: 0.0, yaw_rad: 0.0}
    goal: {x: 2.45, y: -0.3}
    initial_task: cross_narrow_aisle
  - robot_id: robot_2
    marker_id: 2
    spawn: {x: 1.2, y: 0.0, yaw_rad: 3.141592653589793}
    goal: {x: -2.0, y: 0.0}
    initial_task: cross_narrow_aisle
  - robot_id: robot_3
    marker_id: 3
    spawn: {x: -1.9, y: 0.0, yaw_rad: 0.0}
    goal: {x: 2.45, y: 0.3}
    initial_task: cross_narrow_aisle
  - robot_id: robot_4
    marker_id: 4
    spawn: {x: -2.47, y: 0.0, yaw_rad: 0.0}
    goal: {x: 1.85, y: 0.0}
    initial_task: cross_narrow_aisle

# A55-J: the C55 aperture, L = 1.0, centred at the junction (T2b's barrier).
aisle_barrier:
  effective_width_m: 0.55
  center_x_m: 0.0
  length_m: 1.0

timed_obstacles: []
static_obstacles: []

expected_conflict:
  type: deadlock
  involved_robots: [robot_1, robot_2, robot_3, robot_4]
  # Four-stack M5 start ~20 sim-s, standoff ~27 sim-s.
  onset_window_sec: [15.0, 50.0]
  min_duration_sec: 2.0

oracle:
  correct_yielder: robot_2
  # Arm B's FCFS at the symmetric standoff is a full tie; its robot-id
  # tie-break yields robot_2, matching the oracle only by that tie-break.
  fcfs_yielder: robot_2
  feasible_yielders: [robot_1, robot_2]
  objective: min_total_time_to_goal
  correct_order: [robot_1, robot_3, robot_4]
  correct_strategy: convoy
  accepted_strategies: [convoy, yield]
  platoon: [robot_1, robot_3, robot_4]
  rationale: >-
    flow: three eastbound robots queue behind robot_1, so one yield by the
    counter-flow robot_2 clears all of them nose to tail; yielding robot_1
    instead escorts robot_2 west to x -1.774, 0.13 m from the held robot_3
    (a latch: the alternative is censored, a lower-bound margin as in T2b).
  # margin: pending the four-robot forced-order harness (VM smoke batch).

runtime:
  physics_hz: 60
  rendering_hz: 30
