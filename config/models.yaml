vlm:
  reasoner:
    backend_id: openai      # switch to "mock" or "llama_server" for local/offline runs
    timeout_sec: 120         # Cosmos Reason 2 emits a long reasoning trace; allow time
    max_attempts: 2
    # Sampling per NVIDIA Cosmos Reason 2 prompt guide (Qwen3 "with reasoning" preset).
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    presence_penalty: 0.0
    max_tokens: 2048         # room for <think> reasoning plus the final JSON
    allow_reask: true

  llama_server:
    base_url: "http://127.0.0.1:8080/v1"
    model_id: cosmos-reason2-8b
    model_path: "$HOME/models/nvidia.Cosmos-Reason2-8B.f16.gguf.Q6_K.gguf"
    mmproj_path: "$HOME/models/mmproj-nvidia.Cosmos-Reason2-8B.f16.gguf"

  # Hosted GPT backend. Switch reasoner.backend_id to "openai" to use it.
  # The API key is NOT stored here — set the env var named by api_key_env.
  openai:
    model_id: gpt-4o
    base_url: "https://api.openai.com/v1"
    api_key_env: OPENAI_API_KEY   # export OPENAI_API_KEY=sk-... in your shell/.env
    organization: null
    # gpt-4o is a classifier here, not a chain-of-thought model: sample greedily
    # (project rule; rev-8 model table). Overrides the shared reasoner block above,
    # which stays at the Cosmos preset for llama_server. Run 3 (2026-09-17) flipped
    # none -> deadlock on an unchanged scene at temperature 0.6.
    reasoner:
      temperature: 0.0
      # Refusal trigger is the frame, not the text; 4 attempts cuts terminal
      # refusal 57.1% -> 26.9% (p=0.031). docs/reports/2026-09-25-frame-replay.md
      max_attempts: 4

  # Hosted Gemini Robotics-ER 2 backend (Interactions API, not :generateContent).
  # Switch reasoner.backend_id to "gemini" to use it. The API key is NOT stored
  # here — set the env var named by api_key_env.
  #
  # No reasoner: override here on purpose: the Interactions API's
  # generation_config exposes no temperature/top_p/top_k fields at all (not
  # merely unsupported values), so pinning one here would misleadingly imply a
  # decoding choice that the API cannot honor. The shared reasoner: block's
  # sampling fields still apply to this backend's ReasonerConfig, but
  # GeminiBackend drops them from the request and records them per call in
  # BackendResponse.raw["unsupported_sampling"] instead. See
  # docs/superpowers/specs/2026-09-18-gemini-robotics-er2-integration-design.md
  # section 4.
  gemini:
    model_id: gemini-robotics-er-2-preview
    api_key_env: GEMINI_API_KEY   # export GEMINI_API_KEY=... in your shell/.env
    thinking_level: low
    force_schema: false

embeddings:
  model_name: sentence-transformers/all-MiniLM-L6-v2
