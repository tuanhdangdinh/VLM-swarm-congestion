# S1b-ONLY M3 grounding parameters WITH the prereg-v3 A26 retreat shield and
# the B3 fresh-latch fast-fail (live batch 3). PILOT-ONLY.
#
# A copy of config/grounding/s1b_dynamic.yaml (md5 535f5281..., pinned, never
# edited) with exactly THREE added keys; every other key is byte-identical in
# value, and tests/unit/test_a26_retreat_shield.py pins that:
#   retreat_shield: true          -- hold (unlinked temporary_wait, tagged
#                                    grounding=retreat_shield:<id>) every
#                                    bystander whose M5 task-intent path
#                                    (current node, then the next one when it
#                                    can leave inside the yield's nominal
#                                    motion time) comes within
#                                    min_distance_m + margin of the retreat
#                                    corridor; a bystander pinned in a
#                                    standing latch is never held
#                                    (reasoning/rag/retreat_shield.py).
#   retreat_shield_margin_m: 0.05 -- corridor margin beyond the 0.45 m latch
#                                    distance (the retreat_box_margin_m
#                                    precedent). Frozen on the 9 A25 yields:
#                                    E17b r2 at 0.42 m must be held, E16 r5
#                                    at 0.57 m must not.
#   retreat_fast_fail: true       -- mark each dynamic yield/reverse
#                                    fresh_latch_fast_fail so M4 fails the
#                                    backup/pull-off when the clearing robot
#                                    is newly latched (B3 stop-gap).
# Selected per run by an orchestrator overlay's grounding_params_path; the
# shipped config/rag.yaml and config/orchestrator.yaml are untouched.
grounding:
  mode: derived
  min_distance_m: 0.45
  backup_clearance_m: 1.7
  escort_clearance_m: 0.5
  backup_band_m: [0.5, 2.0]
  escort_band_m: [1.0, 3.5]
  lateral_m: 0.35
  sweep_step_m: 0.1
  aisle_y_band_m: [-1.66, 1.66]
  aisle_x_band_m: [-2.36, 2.36]
  dynamic_scene_arms: true
  dynamic_handoff_radius_m: 0.5
  retreat_box_margin_m: 0.05
  escort_turn_cap: true
  retreat_shield: true
  retreat_shield_margin_m: 0.05
  retreat_fast_fail: true
