# Run line (pilot; caps computed for S1):
#   SCENARIO=mapd_5 MAP_SCENARIO=bottleneck_merge SEED=978442588 \
#     BACKEND_ID=<backend> RECORD=0 REC_SEC=4800 \
#     NAV2_ACTIVE_TIMEOUT_SEC=360 ./scripts/vm/fc_launch.sh
#   - REC_SEC=4800: H = 600 sim-s at extrapolated 5-stack RTF 0.15-0.19 is
#     600/0.19 = 3158 to 600/0.15 = 4000 wall-s of Isaac lifetime (the scene
#     doc's 53-67 wall-min), + ~500 wall-s bring-up/overhead + margin; the
#     REC_SEC tail cap (REC_SEC - 10 = 4790) must outlive Isaac or stage 9
#     truncates the episode. Option B ends the tail ~10 s after Isaac exits,
#     so an over-generous cap costs nothing on a normal run. If the measured
#     RTF comes in below ~0.13, re-set REC_SEC ~ 600 / RTF_measured + 800.
#   - SIM_SEC is NOT set: it is inert (duration_sec above rules Isaac).
#   - NAV2_ACTIVE_TIMEOUT_SEC=360: the 240 s default was sized on <= 4
#     stacks (1-in-3 bring-up failures pre-gate; robot_4 active > 90 s after
#     launch); a fifth stack extrapolates ~+90-120 s.
#   - NAV2_LAUNCH_STAGGER_SEC stays at its default 3 (env-overridable).
