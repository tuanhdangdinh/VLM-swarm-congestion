schema_version: 1
name: head_on_deadlock
seed: 42
duration_sec: 300.0

# Spawn at the deadlock SNAPSHOT, not the pre-deadlock start. The integration
# run is a static scene (ros_graphs.py omits the /cmd_vel driver), so robots
# never leave spawn. Placing them at the goal lines (x=+-3) would freeze them
# 6 m apart at the camera FOV edges, where their ArUco markers straddle the
# frame boundary (undetectable) and the geometry is not a deadlock. Spawning
# nose-to-nose near the aisle centre (x=+-0.6, 1.2 m apart, headings opposed)
# puts both markers fully in-frame near image centre AND presents the genuine
# head-on standoff M2 must classify. Goals stay at +-3 to match the
# orchestrator initial_tasks, so each robot's goal is across the other.
robots:
  - robot_id: robot_1
    marker_id: 1
    spawn: {x: -0.6, y: 0.0, yaw_rad: 0.0}
    goal: {x: 3.0, y: 0.0}
    initial_task: cross_narrow_aisle
  - robot_id: robot_2
    marker_id: 2
    spawn: {x: 0.6, y: 0.0, yaw_rad: 3.141592653589793}
    goal: {x: -3.0, y: 0.0}
    initial_task: cross_narrow_aisle

timed_obstacles: []

aisle_barrier:
  # 0.55m corridor, 2.0m long: reads as a genuine narrow corridor (~3 robot
  # widths) where a mid-tunnel head-on meeting is visually unresolvable —
  # the earlier 0.70m x 0.9m version looked like a doorway two robots could
  # obviously share (physically true: two-abreast needs only ~0.36m). The
  # deadlock is enforced by the 0.45m safety envelope: usable center band
  # is 0.55-2*0.16=0.23m, far below the required separation. 0.55m remains
  # approach-plannable (global inflated half-width 0.19m leaves ±0.085m,
  # proven in H3 runs 4-5); the gap TRANSIT no longer depends on width at
  # all — the passer is escorted through on raw cmd_vel (probe-proven that
  # collision_monitor, not DWB, vetoed Nav2 transit in here). Maneuver
  # margins at length 2.0 (corridor spans x=±1.0): yielder backs 1.3m from
  # ~-0.25 to ~-1.55 (0.55m past the west end, room to sidestep); escort
  # 2.4m ends ~0.2m past the yielder+0.45m crossing-safe point.
  effective_width_m: 0.55
  center_x_m: 0.0
  length_m: 2.0

expected_conflict:
  type: deadlock
  involved_robots: [robot_1, robot_2]
  onset_window_sec: [8.0, 25.0]
  min_duration_sec: 2.0

runtime:
  physics_hz: 60
  rendering_hz: 30
