#       SEMANTICS -- premature release). Arithmetic: dwell 5 sim-s = 26.3
#       (RTF 0.19) to 33.3 (RTF 0.15) wall-s, + measured departure latency
#       (goal accept -> first motion, ~2-5 wall-s on 4 stacks) = 28-38
