controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Default xy_goal_tolerance is 0.25m (verified on host via `ros2 param
      # get`), looser than this project's 0.15m acceptance bar (Task 8) --
      # set explicitly so Nav2 itself stops within the bar this project
      # checks against, rather than risking a spurious "tolerance near-miss"
      # being misread as a navigation failure.
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      max_vel_x: 0.18   # safety.yaml max_linear_velocity_mps cap, NOT the 0.22 mechanical max
      min_vel_x: 0.0
      max_vel_theta: 1.5
      use_stamped_cmd_vel: false   # verified Phase 1: ROS2SubscribeTwist takes plain Twist
      # acc_lim_x/decel_lim_x/acc_lim_theta/decel_lim_theta -- verified on host
      # during Task 8 acceptance testing: omitting these resolves to 0.0 in this
      # Jazzy DWB build (confirmed via `ros2 param get
      # /robot_1/controller_server FollowPath.acc_lim_x` -> 0.0), not upstream's
      # documented 2.5 default. With acc_lim_x=0.0 the max velocity reachable
      # from rest within one control cycle is acc_lim_x * sim_period = 0, so
      # DWB's trajectory generator produces zero candidate velocity samples
      # every cycle ("Could not find a legal trajectory: No valid trajectories
      # out of 0!", every single control loop) and the robot never moves at
      # all, regardless of path/obstacles. Values below are standard
      # TurtleBot3 Burger-class limits, not independently tuned for this
      # footprint. Decel limits must stay negative -- DWB's velocity window
      # is [v - decel*dt, v + acc*dt], so a positive decel_lim collapses the
      # window the same way acc_lim=0 did.
      acc_lim_x: 2.5
      decel_lim_x: -2.5
      acc_lim_theta: 3.2
      decel_lim_theta: -3.2
      # max_speed_xy/min_speed_xy -- verified on host during Task 8 DWB tuning:
      # upstream nav2_dwb_controller's kinematic_parameters.cpp declares these
      # with a literal 0.0 default (confirmed by reading the declare_or_get_parameter
      # calls), NOT a "disabled" sentinel like -1.0. KinematicParameters::isValidSpeed()
      # activates its check whenever max_speed_xy_ >= 0.0, so the unset 0.0 default
      # makes EVERY candidate trajectory with hypot(vx,vy) > 0 fail validation before
      # scoring -- independent of acc_lim_x/critic weights. Confirmed by capturing
      # /robot_1/evaluation (dwb_msgs/LocalPlanEvaluation) live during an active goal:
      # all 20 candidate twists in every message had vx=0.0 exactly, never positive,
      # with acc_lim_x=2.5 and a straight clear path already confirmed live --
      # generation, not scoring, was the actual defect. Set to match max_vel_x so the
      # xy speed cap is consistent with the existing linear velocity limit instead of
      # silently overriding it to zero.
      max_speed_xy: 0.18
      min_speed_xy: 0.0
      min_speed_theta: 0.0
      # DWB's RotateToGoal gate uses FollowPath.xy_goal_tolerance, not the
      # SimpleGoalChecker's tolerance above. Leaving it unset defaults to
      # 0.25m (confirmed live via `ros2 param get`), so DWB switches to
      # rotate-in-place while the robot is still outside this project's 0.1m
      # goal checker tolerance and cannot finish the last 0.13-0.15m. Also
      # keep trans_stopped_velocity below max_vel_x: the Jazzy default 0.25
      # is higher than this robot's 0.2m/s safety cap, so RotateToGoal treats
      # every translational command as "stopped".
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.01
      # DWB requires an explicit, non-empty critics list (verified on host:
      # "No critics defined for FollowPath" aborts controller_server
      # configure without one) -- not in the brief's pinned snippet, added
      # here as the minimal standard TurtleBot3-class critic set from the
      # upstream nav2_bringup reference params, not independently
      # tuned for this footprint.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      # Brief's snippet used the C++-namespace form
      # "nav2_navfn_planner::NavfnPlanner"; verified on host this installed
      # Historical host-Humble check: Humble version (1.1.20) registered the pluginlib class as
      # "nav2_navfn_planner/NavfnPlanner" (slash, not double-colon) --
      # planner_server failed to load with that form there
      # ("does not exist. Declared types are ... nav2_navfn_planner/NavfnPlanner").
      # Re-verified during the Jazzy pivot (Task 6 redo) against the
      # installed Jazzy 1.3.12 nav2_navfn_planner plugin XML
      # (/opt/ros/jazzy/share/nav2_navfn_planner/global_planner_plugin.xml),
      # which registers the class as "nav2_navfn_planner::NavfnPlanner"
      # (double-colon) -- the *opposite* convention from the Humble build on
      # this same host. Pluginlib registration strings are not stable across
      # distro/version; re-verify per distro rather than copying from a
      # different verified build.
      plugin: "nav2_navfn_planner::NavfnPlanner"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      # `<robot_namespace>` is the verified Nav2 multi-robot placeholder
      # token (bringup_launch.py's ReplaceString action, condition
      # use_namespace) -- substituted by nav2_robot.launch.py to
      # "/<robot_id>" before this file is parsed. Required because Isaac's
      # /tf frame_ids are namespace-prefixed (e.g. "robot_1/odom",
      # "robot_1/base_link" -- verified on host via `ros2 topic echo /tf`)
      # but navigation_launch.py itself does NOT auto-prefix frame names
      # (verified against the installed Jazzy source -- it only remaps the
      # /tf and /tf_static *topics*, "there doesn't seem to be a better
      # alternative" per its own comment); without this, local_costmap waits
      # forever on the unprefixed "odom" frame, which never exists, and
      # controller_server's activation hangs until lifecycle_manager's own
      # timeout aborts the whole bringup.
      global_frame: "<robot_namespace>/odom"
      robot_base_frame: "<robot_namespace>/base_link"
      # `rolling_window` defaults to false; without it this 3x3m costmap is
      # pinned at its initial odom-frame origin instead of following the
      # robot, so the robot quickly drives off the edge of its own local
      # costmap ("Robot is out of bounds of the costmap", confirmed on host
      # during Task 8 acceptance testing) and DWB has no local costmap data
      # to score trajectories against -- the robot cannot move at all, not
      # just navigate poorly. Required for any goal beyond a ~1.5m radius of
      # spawn.
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[-0.07, -0.09], [-0.07, 0.09], [0.07, 0.09], [0.07, -0.09]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          # Costmap nodes run under an extra `/<robot_id>/local_costmap` or
          # `/<robot_id>/global_costmap` namespace, so a relative `scan`
          # resolves to `/robot_1/local_costmap/scan` rather than Isaac's
          # actual lidar topic `/robot_1/scan` (confirmed on host via
          # `ros2 node info /robot_1/local_costmap/local_costmap`). Use the
          # same frame-id substitution token as above, but with a leading
          # slash because this is an absolute topic name, not a tf frame.
          topic: "/<robot_namespace>/scan"
          max_obstacle_height: 2.0
          obstacle_max_range: 3.5
      # inflation_layer.plugin not in the brief's pinned snippet; required --
      # verified on host: costmap configure fails ("Can not get 'plugin'
      # param value for inflation_layer") without it, since `plugins:` only
      # lists layer *names*, each of which independently needs its own
      # `plugin:` key naming the implementing class.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Nav2 default inflation_radius is 0.55m. With robot half-width 0.09m,
        # that inflates to 1.28m — wider than the entire 1.2m aisle, making the
        # 0.4-0.55m barrier gap fully lethal and unnavigable. Set explicitly to
        # 0.10m: inflated half-width = 0.09+0.10 = 0.19m, gap 0.55m gives
        # 0.17m navigable clearance, narrow but viable for the deadlock scenario.
        inflation_radius: 0.10

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      # `global_frame: map` stays unprefixed: it is the single shared
      # warehouse map frame, not per-robot. `robot_base_frame` IS
      # per-robot -- same `<robot_namespace>` substitution rationale as
      # local_costmap above.
      global_frame: map
      robot_base_frame: "<robot_namespace>/base_link"
      footprint: "[[-0.07, -0.09], [-0.07, 0.09], [0.07, 0.09], [0.07, -0.09]]"
      # Costmap2DROS's `map_topic` param is consumed as an already
      # namespace-qualified subscription name -- verified on host via
      # `ros2 param get .../global_costmap map_topic`, which showed it
      # resolved to `/robot_1/map` with no override, even though
      # nav2_robot.launch.py's SetRemap(src="map", dst="/map") (a plain
      # relative match key, the same shape that fixed an analogous bug
      # earlier in this file's history) was present on the process's own
      # command line and verified working for an isolated rclpy
      # create_subscription("map", ...) test. So this subscription's name
      # is not produced through the ordinary relative-name + remap pipeline
      # the way it is for most other Nav2 topics -- it must be set directly
      # as the absolute literal here instead of relying on launch-time
      # remapping. The shared, non-namespaced map_server (module docstring,
      # nav2_robot.launch.py) only ever publishes on unnamespaced `/map`.
      map_topic: /map
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          # See the local_costmap obstacle layer above: this must resolve to
          # Isaac's robot lidar topic, not a nested costmap-local `scan`.
          topic: "/<robot_namespace>/scan"
          max_obstacle_height: 2.0
          obstacle_max_range: 3.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.10

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: "<robot_namespace>/base_link"
    # Increase action server timeouts: the default 20s default_server_timeout
    # (used by BT action nodes like ComputePathToPose as their server_timeout
    # attribute when not overridden in the BT XML) can expire if the planner
    # is slow at startup, producing "Timed out while waiting for action server
    # to acknowledge goal request for compute_path_to_pose". 60s gives
    # the planner server adequate startup + first-plan headroom. The
    # action_server_result_timeout (default 900s) covers how long to wait for
    # a planner result after goal acceptance — set conservatively.
    default_server_timeout: 60
    action_server_result_timeout: 60.0

behavior_server:
  ros__parameters:
    use_sim_time: true
    # Same `<robot_namespace>` substitution rationale as local_costmap/
    # bt_navigator above (module docstring of nav2_robot.launch.py): verified
    # on host that these otherwise default to unprefixed "odom"/"base_link",
    # which transformPoseInTargetFrame can never resolve against this
    # project's namespace-prefixed /tf tree ("No Transform available...
    # target_frame does not exist"), aborting every spin/backup recovery
    # behavior with "Current/Initial robot pose is not available." Recovery
    # behaviors are not on the primary path-following path, so this did not
    # block forward motion, but left uncorrected it silently breaks recovery
    # the first time the controller actually needs it.
    local_frame: "<robot_namespace>/odom"
    global_frame: map
    robot_base_frame: "<robot_namespace>/base_link"

waypoint_follower:
  ros__parameters:
    use_sim_time: true

# Jazzy's nav2_bringup navigation_launch.py (1.3.12, verified on the Jazzy
# container's installed package) includes auxiliary lifecycle nodes absent from
# the Humble-era brief/spec. The vendored navigation launch intentionally omits
# route_server (needs a route graph file) and velocity_smoother (unused in this
# stack's controller -> collision_monitor -> Isaac watchdog command path).
# The remaining auxiliary nodes still need minimal valid configuration even
# though this project does not use smoothing or docking directly.
smoother_server:
  ros__parameters:
    use_sim_time: true

route_server:
  ros__parameters:
    use_sim_time: true

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "<robot_namespace>/base_link"
    odom_frame_id: "<robot_namespace>/odom"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 0.1
    # A real forward stop zone, not the old lifecycle-only no-op. Keep the
    # polygon narrow so aisle walls do not immediately trigger it, but long
    # enough to stop a head-on robot before body contact at this stack's
    # 0.2 m/s linear cap. This is a local reactive guard only; it does not
    # solve yielding, right-of-way, or deadlock recovery.
    polygons: ["forward_stop"]
    forward_stop:
      type: "polygon"
      action_type: "stop"
      points: "[[0.40, 0.18], [0.40, -0.18], [0.02, -0.18], [0.02, 0.18]]"
      min_points: 3
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      # Absolute topic using the namespace token: collision_monitor nodes run
      # under /<robot_id>/collision_monitor, so a relative "scan" resolves to
      # /<robot_id>/collision_monitor/scan (nonexistent). Must use the absolute
      # /<robot_namespace>/scan to receive Isaac's per-robot lidar data.
      topic: "/<robot_namespace>/scan"
      min_height: 0.05
      max_height: 2.0
      enabled: true

docking_server:
  ros__parameters:
    use_sim_time: true
    # Same pattern as collision_monitor's `polygons` above: `dock_plugins` is
    # declared with no default and the configure step then needs a real,
    # named plugin entry -- verified on host, omitting it ("Charging dock
    # plugins not given!") aborts the whole lifecycle_manager_navigation
    # bringup. This project does not use docking at all; `dummy_dock` is the
    # stock `opennav_docking::SimpleChargingDock` plugin configured but never
    # invoked by any behavior tree or action call here -- it exists only to
    # satisfy Jazzy's lifecycle_manager_navigation node list.
    dock_plugins: ["dummy_dock"]
    dummy_dock:
      plugin: "opennav_docking::SimpleChargingDock"
