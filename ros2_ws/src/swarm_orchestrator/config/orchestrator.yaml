# M5 orchestrator config. Loaded by orchestrator_node via the config_file param.
stall_threshold_sec: 12.0
progress_epsilon_m: 0.10
# Arrived robots sit inside Nav2's xy_goal_tolerance (0.1 m); this must exceed
# that so a parked robot is never re-flagged as stalled.
goal_reached_tolerance_m: 0.15
# Once M4 reports a base goal reached, the robot is excused from stall evidence
# while M1 still sees it within this radius of that goal (M1 can read a parked
# robot 0.2-0.3 m off near the ROI edge, outside goal_reached_tolerance_m).
arrived_radius_m: 0.5
proximity_threshold_m: 0.50
proximity_slow_speed_mps: 0.05
cooldown_sec: 15.0
command_timeout_sec: 20.0
# Window after a command resolves in which the attempt is fed back to the VLM
# as "previous attempt" context on re-analysis. Must exceed cooldown_sec +
# stall_threshold_sec (27 s here) or it can never fire; 0 disables it (the RQ5
# memoryless control).
failure_context_window_sec: 60.0
# Ablation axis: false withholds the derived pairwise distance/facing lines so
# the VLM must judge geometry from coordinates + image (rev-8 modality table).
prompt_pairwise_geometry: true
reasoning_backend_id: openai
frame_dump_dir: data/logs/m5_frames
decision_log_dir: data/logs/m5_decisions
keep_debug_frames: false
frame_scene_max_skew_sec: 1.0
frame_downscale_width: null
initial_tasks:
  robot_1: { task: cross_narrow_aisle, goal: [2.5, 0.0] }
  robot_2: { task: cross_narrow_aisle, goal: [-2.5, 0.0] }

# Scene dimensions M3 derives the yield maneuver from. They mirror
# isaac/config/scenarios/head_on_deadlock.yaml (barrier spans x=+-1.0, 0.9 m
# tall), isaac/config/warehouse.yaml (nominal_aisle_width_m 1.2) and
# vgu_sim CameraConfig (camera at z=3.0); keep them in sync by hand until M5
# reads the scenario file directly.
scenario_geometry:
  corridor: { axis: x, center_m: 0.0, half_length_m: 1.0, aisle_half_width_m: 0.6, occluder_height_m: 0.9 }
  camera: { height_m: 3.0, marker_height_m: 0.21 }
  robot: { half_width_m: 0.09, marker_half_size_m: 0.06, safety_radius_m: 0.45 }
  park_margin_m: 0.4  # 0.3 lost the marker for 7.6s after the side-step; 0.4 verified clean (2026-09-16)
  wall_margin_m: 0.15
  passer_margin_m: 0.2
