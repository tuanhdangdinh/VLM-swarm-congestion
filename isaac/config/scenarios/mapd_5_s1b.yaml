# Rack coverage (R3.6a item 3, counted on the tracked band, 18.0 m2):
#   2 x 0.55 x 1.60 = 1.76 m2 -> 1.76 / 18.0 = 9.78 % (S1a: 9.77 m2, 54.3 %).
#
# Corridors (R3.6a item 1, latch-aware): two passing robots need centre
# separation >= 0.45 m (the M4 latch), and each centre must keep its whole
# 0.18 m-wide chassis outside the 0.10 m global inflation of its wall
# (centre >= 0.09 + 0.10 = 0.19 m off the face), plus one 0.05 m costmap
# cell of quantisation:  W_min = 0.45 + 2 * 0.19 + 0.05 = 0.88 m, inside
# R3.6a's 0.85-0.90 m. Measured on this map's costmap (cells across the
# gap at mid-span; scripts/s1b_layout.py):
#   | gap                          | W (m) | cost<253 (m) | cost=0 (m) |
#   | west wall  <-> island_w      | 1.20  | 1.15         | 1.10       |
#   | island_w   <-> island_e      | 1.00  | 0.90         | 0.80       |
#   | island_e   <-> east wall     | 1.70  | 1.65         | 1.60       |
#   | island_w   <-> north wall    | 0.90  | 0.80         | 0.70       |
#   | island_w   <-> south wall    | 1.10  | 1.00         | 0.90       |
#   | island_e   <-> north wall    | 1.10  | 1.05         | 1.00       |
#   | island_e   <-> south wall    | 0.90  | 0.85         | 0.80       |
#   Every gap >= 0.90 m >= W_min; every zero-cost band >= 0.70 m >= 0.45 m
#   (two centres 0.45 apart both on zero-cost cells). The GEOMETRIC claim
#   is necessary, not sufficient: R3.6a acceptance is a LIVE two-robot
#   opposing pass in a >= 0.85 m corridor without tripping the 0.45 m latch
#   (S1a prior: 0 of 4 opposing approaches in three S1a bundles cleared
#   0.45 m; minimum gaps 0.303-0.394 m, E2's in a 1.2 m strip).
#
# Task nodes (labels and forbidden pair are S1a's, so a seed draws the
# IDENTICAL start assignment and 25-task stream on both floors; positions
# are new; yaw = spawn heading, S1a's per-label yaws):
#   | Node | x      | y      | yaw   | placement                               |
#   | Wp   | -2.30  | +1.35  | 0     | west wall, on the island_w north-gap lane |
#   | Wm   | -2.30  | -1.35  | 0     | west wall, on the island_w south-gap lane |
#   | N    | -0.25  | +1.35  | -pi/2 | north-gap lane, over the inter-island corridor |
#   | S    | -0.25  | -1.35  | +pi/2 | south-gap lane, under the inter-island corridor |
#   | E    | +2.30  |  0.00  | pi    | east, in front of the E aisle stub        |
#   LANE-ALIGNED: Wp-N and Wm-S run straight along the two island_w gaps
