#   | G3 | max share of first conflicts in any 1.2 x 1.2 m window (S1a's junction box) | regime distinctness: below S1a's own share under the same router (grid: 0.445; registered nominal-route MC: 309/400 = 0.773) | < 0.445 | 0.275 | yes |
#   | G4 | Delta-artifact share of first conflicts | S1a MC 0/400; tolerance = G1's 1/(2R) | <= 0.025 | 0.000 | yes |
#   | G5a-geo | first conflict GEOMETRICALLY resolvable by one yield (some member has >= 1.7 - gap m of clear rear room: band, boxes + 0.14 m, other robots' 0.45 m radii) | the floor must let a 2-episode pilot show a resolvable first conflict with P >= 0.95: 1 - (1 - q)^2 >= 0.95 -> q >= 1 - sqrt(0.05) | >= 0.776 | 0.818 | yes |
#   | G5b | >= 3-robot < 0.45 m contact onsets per episode, pass-through run (E2's cluster pattern) | below S1a's own rate under the same router | < 3.31 | 2.55 | yes |
#   GATE: PASS (6/6). Other first-conflict figures: median 12.0 sim-s
#   (p10 8.0); kinds head-on 334, crossing 35, same-direction 19, static 12
#   (S1a: 295/84/17/4); top 0.5 m hotspots (-1.5,-1.5) 43, (-1.5,+1.0) 40,
#   (-2.0,-0.5) 31, (-1.0,+1.0) 31 -- the two island_w gaps and the west
#   passage. Encounters/episode 3.14 (S1a 3.26).
#   GROUNDED EXECUTABILITY (reported, NOT gated -- an M3 capability, not a
#   floor property; scripts/s1_grounding_replay.py): each MC first-conflict
#   scene 2.5 sim-s after the encounter, replayed through the real
#   ground_reasoner_result as the echo mock would ask (stalled robots in
#   id_asc order, the first one the yielder), with this overlay, its 6
#   boxes and s1b_dynamic.yaml in swap mode. EXECUTABLE yield: S1b 162/400
#   = 0.405 (0.405 with the pair pulled in to 0.35 m); S1a (mapd_5 overlay,
#   s1_dynamic) 138/400 = 0.345 (0.325). The rest: an EMPTY reroute (a
#   no-op in M4) + a 15 s wait, 124/400 (S1a 166) -- M3's 0.95 m room gate
#   keeps a yielder whose retreat sweep then needs 1.7 - gap ~ 1.3 m and
#   finds none, never swapping to the partner that has it; and REFUSALS,
#   114/400 (S1a 96), 80 of them dynamic_arms:ambiguous (headings > 30 deg
#   off both axes; the first, diagonal-route layout lost 185/400 = 46 % here
#   and grounded only 0.247, which is why the nodes are lane-aligned).
#   Pilot expectation: P(>= 1 executable first-conflict yield in 2
