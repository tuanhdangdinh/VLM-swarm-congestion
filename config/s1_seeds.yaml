# S1 (mapd_5) registered episode-seed list -- v3 scene design, S1 "Runs":
# "A 100-seed registered list. The family axis is the seeded task order and
# start assignment. Confirmatory n is R = 20 per arm, registered, from the
# FIRST 20 seeds; seeds 21-100 are an extension only."
# (docs/superpowers/specs/2026-10-06-v3-scene-design.md, S1 parameter table.)
#
# Generation procedure (deterministic; tests/unit/test_mapd_5_scenario.py
# regenerates the list and pins sha256_digest):
#   import hashlib, random
#   rng = random.Random(int.from_bytes(
#       hashlib.sha256(b"vgu-s1-seed-list:v1").digest()[:8], "big"))
#   seeds = rng.sample(range(1, 2**31), 100)
# The salt string follows swarm_orchestrator.task_stream._rng (sha256, never
# hash(), so PYTHONHASHSEED cannot change the draw); rng.sample gives 100
# DISTINCT seeds. sha256_digest is over the canonical comma-joined decimal
# list ",".join(str(s) for s in seeds).
#
# Use per episode: seed k feeds BOTH
#   - orchestrator.yaml task_stream.seed (the task-order draw), and
#   - the episode's spawn assignment: the scenario yaml's spawns must equal
#     swarm_orchestrator.task_stream.draw_start_nodes(seed, robots, nodes),
#     and task_stream.start_nodes is pinned to the same map (the start_check:
#     the plan's first tasks-JSONL record then carries start_nodes_drawn=false
#     and any spawn mismatch is detectable against it). A new seed therefore
#     needs the scenario yaml REGENERATED and its USD REBUILT (a yaml edit is
#     inert until build_scenario regenerates the USD).
# fc_launch.sh SEED should carry the same value (names the GT directory).
#
# APPEND-ONLY: never reorder, remove or regenerate; the first 20 are the
# confirmatory candidates and are frozen with this file.
