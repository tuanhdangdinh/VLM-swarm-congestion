vlm:
  reasoner:
    backend_id: openai      # switch to "mock" or "llama_server" for local/offline runs
    timeout_sec: 120         # Cosmos Reason 2 emits a long reasoning trace; allow time
    max_attempts: 2
    # Sampling per NVIDIA Cosmos Reason 2 prompt guide (Qwen3 "with reasoning" preset).
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    presence_penalty: 0.0
    max_tokens: 2048         # room for <think> reasoning plus the final JSON
    allow_reask: true

  llama_server:
    base_url: "http://127.0.0.1:8080/v1"
    model_id: cosmos-reason2-8b
    model_path: "$HOME/models/nvidia.Cosmos-Reason2-8B.f16.gguf.Q6_K.gguf"
    mmproj_path: "$HOME/models/mmproj-nvidia.Cosmos-Reason2-8B.f16.gguf"

  # Hosted GPT backend. Switch reasoner.backend_id to "openai" to use it.
  # The API key is NOT stored here — set the env var named by api_key_env.
  openai:
    # Pinned at the prereg-v1 tag (2026-09-30, design spec rev 9.5 line 1249):
    # a dated snapshot, not a floating alias, so an OpenAI-side re-point cannot
    # change the model mid-collection. See docs/superpowers/specs/
    # 2026-07-05-general-spatial-congestion-resolution-design.md, "Model and
    # decoding pre-registration" for the freeze record.
    model_id: gpt-4o-2024-08-06
    base_url: "https://api.openai.com/v1"
    api_key_env: OPENAI_API_KEY   # export OPENAI_API_KEY=sk-... in your shell/.env
    organization: null
    # gpt-4o is a classifier here, not a chain-of-thought model: sample greedily
    # (project rule; rev-8 model table). Overrides the shared reasoner block above,
    # which stays at the Cosmos preset for llama_server. Run 3 (2026-09-17) flipped
    # none -> deadlock on an unchanged scene at temperature 0.6.
    reasoner:
      temperature: 0.0
      # Refusal trigger is the frame, not the text; 4 attempts cuts terminal
      # refusal 57.1% -> 26.9% (p=0.031). docs/reports/2026-09-25-frame-replay.md
      max_attempts: 4
      # Refusals are stimulus-locked to the annotated frame and persist across
      # re-asks, so after two refused attempts the third re-sends the same prompt
      # text with a neutral grey image. Rev 3 Arm S: the decision content is
      # carried by the text, the frame only amplifies, so the cost is bounded and
      # recorded per call as diagnostics.image_fallback_used.
      # docs/reports/2026-09-25-frame-replay.md
      image_fallback_after_attempts: 2

  # Hosted Gemini Robotics-ER 2 backend (Interactions API, not :generateContent).
  # Switch reasoner.backend_id to "gemini" to use it. The API key is NOT stored
  # here — set the env var named by api_key_env.
  #
  # No reasoner: override here on purpose: the Interactions API's
  # generation_config exposes no temperature/top_p/top_k fields at all (not
  # merely unsupported values), so pinning one here would misleadingly imply a
  # decoding choice that the API cannot honor. The shared reasoner: block's
  # sampling fields still apply to this backend's ReasonerConfig, but
  # GeminiBackend drops them from the request and records them per call in
  # BackendResponse.raw["unsupported_sampling"] instead. See
  # docs/superpowers/specs/2026-09-18-gemini-robotics-er2-integration-design.md
  # section 4.
  gemini:
    model_id: gemini-robotics-er-2-preview
    api_key_env: GEMINI_API_KEY   # export GEMINI_API_KEY=... in your shell/.env
    thinking_level: low
    force_schema: false

  # ---- Model-wiring ruling 2026-10-06 (prereg-v2 design spec, "Model-wiring
  # ruling"). Additive arms; the sections above are untouched pins. A section
  # whose name is not an adapter name selects its transport with `adapter:`.
  # Validation evidence: docs/reports/2026-10-06-model-wiring.md.

  # Claude Sonnet 5.5. The undated id IS the pin (current-generation Claude
  # ids take no date suffix). No temperature/top_p/top_k are ever sent: Sonnet
  # 5.5 rejects non-default sampling values with HTTP 400, so the configured
  # values are recorded per call in `unsupported_sampling` (the ER-2
  # precedent) -- the "documented absence" case. `between_tools` turns
  # thinking off (omitting it runs adaptive thinking, billed as output); with
  # gpt-5.1 at reasoning_effort none and ER-2 at thinking_level low, every new
  # hosted arm answers as a no/low-thinking classifier.
  anthropic:
    model_id: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY   # export ANTHROPIC_API_KEY=... in your shell/.env
    thinking_type: between_tools
    reasoner:
      temperature: 0.0

  # PILOT ARM: gpt-5.1 at reasoning_effort "none" (temperature 0 is legal only
  # at "none"; no reasoning tokens are billed). Same refusal-mitigation block
  # as the gpt-4o pin, so the pilot asks whether the 4o refusal/chance profile
  # persists under identical apparatus. Reasoning-family chat completions take
  # `max_completion_tokens`, not `max_tokens`.
  openai_gpt51:
    adapter: openai
    model_id: gpt-5.1-2025-11-13
    api_key_env: OPENAI_API_KEY
    reasoning_effort: none
    max_tokens_param: max_completion_tokens
    reasoner:
      temperature: 0.0
      max_attempts: 4
      image_fallback_after_attempts: 2

  # Qwen3-VL-8B-Instruct Q4_K_M + F16 mmproj, official Qwen GGUF, served by
  # scripts/vm/qwen_serve.sh (pinned files + sha256, llama.cpp server-cuda
  # image pinned by digest, --alias = model_id below). Greedy: an Instruct
  # (non-thinking) model used as a classifier, so the shared Cosmos 0.6 preset
  # must not leak in. The paths are where qwen_serve.sh caches the files on
  # the VM; the adapter only uses mmproj_path to switch to vision mode.
  llama_server_qwen3vl:
    adapter: llama_server
    base_url: "http://127.0.0.1:8080/v1"
    model_id: qwen3-vl-8b-instruct-q4_k_m
    model_path: "$HOME/models/qwen3vl/Qwen3VL-8B-Instruct-Q4_K_M.gguf"
    mmproj_path: "$HOME/models/qwen3vl/mmproj-Qwen3VL-8B-Instruct-F16.gguf"
    # Frame + zoom tile verified 2026-10-06 (llama.cpp b11434): colours named in
    # send order for both orders, and a recorded tile-on v2 prompt parsed.
    multi_image: true
    reasoner:
      temperature: 0.0

  # EXPLORATORY ARM (coordinator scope extension 2026-10-06): DeepSeek's
  # first vision model over its OpenAI-compatible endpoint. The `-exp` id
  # carries preview-churn risk: DeepSeek's pricing page (fetched 2026-10-06)
  # lists `deepseek-v4-flash-vision-exp` as a retired legacy name served by
  # DeepSeek-V4.1-Flash (`deepseek-flash`), so the served model is recorded
  # per call and the id is unverified against the live listing (no key yet).
  # Thinking defaults ON there and temperature has no effect while it is on,
  # so it is disabled for a greedy classifier.
  deepseek:
    adapter: openai
    model_id: deepseek-v4-flash-vision-exp
    base_url: "https://api.deepseek.com"
    api_key_env: DEEPSEEK_API_KEY   # export DEEPSEEK_API_KEY=... in your shell/.env
    thinking_type: disabled
    reasoner:
      temperature: 0.0

embeddings:
  model_name: sentence-transformers/all-MiniLM-L6-v2
