# v3 S1b: the SAME tracked-band footprint as S1a (mapd_5.yaml; |x| <= 2.5,
# |y| <= 1.8, one overhead camera) with the racks REMOVED from the band and
# two short C55 (0.55 m deep) rack islands placed off-centre. S1a + S1b are a
# REGIME axis (R3.6a item 2: deterministic single-lane -> stochastic
# clogging), not a density axis. Everything else is S1a's: N_A = 5 robots,
# N_G = 5 task nodes with S1a's labels and forbidden pair, N_T = 5 tasks per
# robot, dwell 5 sim-s (pop-on-dwell-end), H = 600 sim-s, park finishers.
# Report: docs/reports/2026-10-09-s1b-first-light.md.
#
# Floor (NEW map; Nav2 runs on THIS scenario's own map):
#   - rack_clearance below cuts all four shared rack quadrants back to
#     outside the band (isaac.vgu_sim.config.rack_clearance_remnants; the
#     warehouse USD is never edited). The band edge becomes the rack
#     remnants' faces, except the two aisle stubs (|y| < 0.6 past |x| = 2.5,
#     |x| < 0.6 past |y| = 1.8), dead ends exactly as in S1a.
#   - static_obstacles = the two rack islands, 0.55 x 1.60 x 0.30 m:
#       island_w x [-1.30, -0.75], y [-0.70, +0.90]  (north-shifted)
#       island_e x [+0.25, +0.80], y [-0.90, +0.70]  (south-shifted)
#     staggered (chicane) and shifted 0.25 m west of the band centre.
#     Height 0.30 m, the loop-map connector-remnant precedent
#     (LoopMapConfig.connector_remnant_height_m): above the 0.182 m lidar
#     plane, so Nav2 sees them, but the camera shadow beyond an island's
#     outer face is (0.30 - 0.21) / (3.0 - 0.30) * r = 0.033 r <= 0.05 m
#     (r <= 1.6 m from the nadir), against 0.33 r = 0.43-0.53 m for a 0.9 m
#     rack. 0.9 m islands would occlude markers along their outboard faces.
#   - Map: ros2_ws/src/swarm_simulation/maps/warehouse_map_mapd_5_s1b.{pgm,yaml}
#     = generate_warehouse_map.py --scenario <this file>; the regen test pins
#     it byte for byte. Run with MAP_SCENARIO=mapd_5_s1b (the default,
#     SCENARIO's own name) after colcon-building swarm_simulation.
