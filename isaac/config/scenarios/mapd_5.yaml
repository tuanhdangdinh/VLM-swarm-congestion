  center_x_m: 1.2
  length_m: 1.0

timed_obstacles: []
static_obstacles: []

# SCHEMA PLACEHOLDER (scene design S1 "The schema has no MAPD shape"): S1
# needs a `mapd` family and an EMERGENT conflict declaration -- no
# pre-declared involved set, episodes found by a GT detector. Until that schema
# item lands, this block satisfies the current schema only: all five robots,
# type deadlock (the junction crossing/head-on standoffs, 309/400 first
# encounters in the MC), window from the proxy (first encounter median 15.0
# sim-s, p90 17.3, after staggered releases) widened for RTF/start jitter.
expected_conflict:
  type: deadlock
  involved_robots: [robot_1, robot_2, robot_3, robot_4, robot_5]
  onset_window_sec: [8.0, 120.0]
  min_duration_sec: 2.0

runtime:
  physics_hz: 60
  rendering_hz: 30
