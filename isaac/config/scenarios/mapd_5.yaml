# Task nodes (scene design S1 "Layout"; yaw = the node's spawn heading):
#   | Node | x      | y      | yaw     | placement                          |
#   | Wp   | -2.30  | +0.35  | 0       | west tip, +0.35 lane, 0.20 in band |
#   | Wm   | -2.30  | -0.35  | 0       | mirror lane (0.70 m from Wp)       |
#   | N    |  0.00  | +1.55  | -pi/2   | north tip, 0.25 inside y band      |
#   | S    |  0.00  | -1.55  | +pi/2   | south tip                          |
#   | E    | +2.30  |  0.00  | pi      | east bay beyond the gate mouth     |
# Routes: node -> arm mouth -> (0,0) -> arm mouth -> node; leg lengths
# 3.10 (N-S), 3.85 (N/S-E), 3.94 (W*-N/S), 4.69 (W*-E); Wp<->Wm legs are
# FORBIDDEN by the generator (instant static encounter at 0.25 m of travel).
#
# Spawns/goals below are SEED-DERIVED, not free design: spawns =
# task_stream.draw_start_nodes(978442588, robots, nodes) and each goal is the
# robot's FIRST drawn task of draw_task_sequences(...) (full sequences:
#   robot_1: E  N  Wm S  N      robot_2: N  Wp N  S  N
#   robot_3: Wp N  Wp S  Wm     robot_4: N  Wm E  Wm S
#   robot_5: S  Wp S  Wp S                                  ).
# A DIFFERENT SEED MOVES THE SPAWNS: regenerate this yaml (spawns, goals) for
# the episode's seed from config/s1_seeds.yaml and REBUILD THE USD.
# tests/unit/test_mapd_5_scenario.py re-derives both draws and fails on any
