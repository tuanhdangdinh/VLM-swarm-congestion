[project]
name = "vgu-vlm-swarm"
version = "0.1.0"
description = "ROS2 + VLM/RAG warehouse swarm coordination scaffold"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.22",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "ros2_ws/src/swarm_perception", "ros2_ws/src/swarm_orchestrator", "ros2_ws/src/swarm_execution"]
markers = [
    "ros2: integration tests that require a sourced ROS2 environment (deselect with -m 'not ros2')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
