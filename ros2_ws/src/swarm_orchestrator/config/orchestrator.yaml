# M5 orchestrator config. Loaded by orchestrator_node via the config_file param.
stall_threshold_sec: 12.0
progress_epsilon_m: 0.10
# Arrived robots sit inside Nav2's xy_goal_tolerance (0.1 m); this must exceed
# that so a parked robot is never re-flagged as stalled.
goal_reached_tolerance_m: 0.15
# Once M4 reports a base goal reached, the robot is excused from stall evidence
# while M1 still sees it within this radius of that goal (M1 can read a parked
# robot 0.2-0.3 m off near the ROI edge, outside goal_reached_tolerance_m).
arrived_radius_m: 0.5
# Nav2's "Goal succeeded" is the primary outcome measure of the experiment and is
# not evidence the robot is at its goal: run 20260925_124609 had bt_navigator
# succeed for robot_2 while M1 put it 0.59 m away. Cross-check M4's base-goal
# arrival report against M1's position before marking the robot arrived.
arrival_position_check: true
# Must exceed M1's ~0.1 m camera bias at the goal (0.15 m vs 0.06 m ground truth
# on 2026-09-17) and stay at or below arrived_radius_m above; 0.59 m was the
# observed false success.
arrival_position_tolerance_m: 0.35
# Older M1 estimates cannot corroborate an arrival; it is then accepted and
# logged as unverified rather than blocked on an M1 outage.
arrival_estimate_max_age_sec: 2.0
proximity_threshold_m: 0.50
proximity_slow_speed_mps: 0.05
cooldown_sec: 15.0
command_timeout_sec: 20.0
# Window after a command resolves in which the attempt is fed back to the VLM
# as "previous attempt" context on re-analysis. Must exceed cooldown_sec +
# stall_threshold_sec (27 s here) or it can never fire; 0 disables it (the RQ5
# memoryless control).
failure_context_window_sec: 60.0
# Ablation axis: false withholds the derived pairwise distance/facing lines so
# the VLM must judge geometry from coordinates + image (rev-8 modality table).
prompt_pairwise_geometry: true
# Ablation axis: true renders the static_obstacles below as world-frame boxes in
# the VLM prompt. Default false — every decision artifact collected so far was
# produced without this channel, and an on-by-default flag would silently break
# comparability with all of them.
prompt_static_obstacles: false
# Ablation axis: order the prompt lists robots in — id_asc, id_desc or random.
# Default id_asc matches every prompt rendered so far; id_desc is the
# counterbalanced condition that tells a positional default ("yield the robot
# presented first") apart from an ID or a geometry preference. random draws one
# of the two per congestion episode, counterbalancing within a run; the drawn
# order is constant across every re-analysis of one episode, and each decision
# artifact records it alongside the mode, the seed and the episode index. Only
# the ordering changes. With three or more robots in the scene (T2b), random
# draws a uniform permutation of their ids instead (recorded as a list).
prompt_robot_order: id_asc
# Seed for the random draw. null derives it from VGU_RUN_ID, falling back to the
# M5 session id, so paired runs launched with the same run id draw the same
# sequence; the fixed modes ignore it. The stage-2 retreat letters are drawn
# from this same seed (a separate, salted stream, one draw per stage-2 call in
# call order), whatever prompt_robot_order says.
prompt_robot_order_seed: null
reasoning_backend_id: openai
frame_dump_dir: data/logs/m5_frames
decision_log_dir: data/logs/m5_decisions
# One M1 scene snapshot per second per M5 session (JSONL, named by session_id)
# for offline trajectory reconstruction; set to null to disable.
scene_log_dir: data/logs/m5_scene
scene_log_period_sec: 1.0
keep_debug_frames: false
# With keep_debug_frames, also dump M1's input frame as <request_id>_raw.png
# beside the annotated one, so the refusal trigger can be tested annotated vs
# raw on the same instant. The M2 request is unchanged (annotated frame).
keep_raw_frames: false
# Camera topic M1 reads (perception.launch.py image_topic); subscribed only
# while keep_raw_frames is on.
raw_frame_topic: /camera/image_raw
frame_scene_max_skew_sec: 1.0
frame_downscale_width: null
# M5's task registry takes goals from HERE, not from the scenario yaml, and
# fc_launch.sh parses only spawn poses out of that yaml. These must therefore be
# set per scenario by hand, like static_obstacles below:
#   head_on_deadlock, *_o0 (beyond goals)  -> +-2.5 as written
#   *_gshort_o0 (goal-short variants)      -> robot_1 [1.5, 0.0], robot_2 [-1.5, 0.0]
#   w0p2_eopen_bshort_o0 (west blocked)    -> robot_1 [2.6, 0.0], robot_2 [-1.5, 0.0]
#   wopen_e0p2_bshort_o0 (east blocked)    -> robot_1 [1.5, 0.0], robot_2 [-2.6, 0.0]
#   normal_flow (T0 lanes, no conflict)    -> robot_1 [2.5, -0.35], robot_2 [-2.5, 0.35]
#     (also set t0_probe_mode: true; the +-2.5 centreline goals below would
#     put the two robots head-on)
#   dynamic_anomaly_v2 (T3c, normal_flow lanes + timed pallet) -> same goals as
#     normal_flow; t0_probe_mode stays false (the stall trigger is the point)
#   blocked_path_object / blocked_path_transient (T3a pair) -> robot_1
#     [2.5, 0.0], robot_2 [0.0, 1.75] (robot_2 parks in the north pocket);
#     t0_probe_mode stays false
#   obstacle_in_candidate (T3b, junction head-on) -> +-2.5 as written, AND
#     scenario_geometry corridor center_m: 1.2, half_length_m: 0.8, AND
#     grounding_aisle_y_band_m: [-0.55, 1.0] (k = 3; header of
#     isaac/config/scenarios/obstacle_in_candidate.yaml)
#   t2b_flow_ordering (T2b, three robots) -> robot_1 [2.5, 0.0], robot_2
#     [-2.0, 0.0], AND robot_3: { task: cross_narrow_aisle, goal: [1.85, 0.0],
#     start_delay_sec: 55 } (hold-back: its goal is sent 55 s after M5 starts),
#     AND scenario_geometry corridor center_m: 0.0, half_length_m: 0.5; the
#     forced-order harness also needs config/rag.yaml grounding.mode: legacy
#     (header of isaac/config/scenarios/t2b_flow_ordering.yaml;
#     scripts/t2b_forced_order.py preflight checks all of it)
#   intersection_bottleneck (T1, four robots) -> robot_1 [1.75, 0.0], robot_2
#     [-1.75, 0.0], AND robot_3: { task: cross_intersection, goal: [0.0, 1.75] },
#     robot_4: { task: cross_intersection, goal: [0.0, -1.75] } (all four
#     tasks cross_intersection), AND shadow_classical_zones:
#     [{ zone_id: crossing_1, x: 0.0, y: 0.0, radius_m: 1.5 }] (Arm B cannot
#     classify `intersection` without it), AND scenario_geometry corridor
#     { axis: x, center_m: 0.0, half_length_m: 0.6, aisle_half_width_m: 0.6,
#     occluder_height_m: 0.0 } (the junction box, no barrier) with arms
#     { robot_1: { axis: x, side: -1 }, robot_2: { axis: x, side: 1 },
#     robot_3: { axis: y, side: -1 }, robot_4: { axis: y, side: 1 } } (each
#     robot yields back along the arm it came in on); camera, robot and margins
#     as shipped (header of isaac/config/scenarios/intersection_bottleneck.yaml).
#     For the v2 `junction_clear` composite (prereg-v2 build-order step 6,
#     intersection-resolvability study S1 section 3's C' geometry): ALSO set
#     scenario_geometry junction_recede_offset_m: 1.2 AND
#     junction_backup_clearance_m: 1.1 -- both required together, or the cross
#     phase (the composite's E-W yield) silently grounds the shipped
#     1.7 m-clearance unsolved row (backup 1.151 m, retreat_x -1.37 m)
#     instead of the solved row (backup 0.799 m, park |x| 1.018 m, escort
#     1.998 m); the loudness guard tags
#     `junction_geometry=shipped_unsolved:missing=<field(s)>` on every
#     affected command whenever either field (or both) is missing
#     (`command_grounder.ground_junction_clear_phases`/`_ground_derived`,
#     docs/implementation_notes.md 2026-10-02 step-5 post-landing entry,
#     bug 4). Step-7a fix (freeze-blocking finding 4, 2026-10-02 composite
#     smoke): ALSO set scenario_geometry tracked_extent_m: 1.75 (the
#     verified M1 y-extent) -- without it a plain `reverse` leg's backup
#     distance has no clamp, and a robot already outward on its own arm
#     (e.g. mid-transit after the composite's post-resolution release) can
#     be driven past the tracked band (reproduced |y|=2.38/2.42 in both
#     live episodes). None (default) keeps every scene without this field
#     byte-identical. Step-7b ruling (iv): ALSO set scenario_geometry
#     junction_recede_stagger_m: 0.2 -- the second recede candidate in chi
#     order then recedes to |y| 1.0 instead of 1.2, so the lead (released
#     first, parking at its goal on that same arm) stops >= 0.65 m behind it
#     instead of 0.45 m (the step-7b rerun's permanent min-distance latch).
#   bottleneck_merge (B1, three robots, merge at the A55-E gate) -> robot_1
#     [2.45, -0.3], robot_2 [1.9, 0.0], AND robot_3: { task:
#     cross_narrow_aisle, goal: [2.45, 0.3], start_delay_sec: 80 } (all three
#     tasks cross_narrow_aisle), AND scenario_geometry corridor { axis: x,
#     center_m: 0.0, half_length_m: 1.1, aisle_half_width_m: 0.6,
#     occluder_height_m: 0.0 } (the junction box; half_length_m raised from
#     0.6 by the rev-19b geometry fix -- header of
#     isaac/config/scenarios/bottleneck_merge.yaml -- to restore the escort
#     margin at the measured trigger poses; the barrier at x 1.2 is off
#     the maneuver) with arms { robot_1: { axis: x, side: -1 }, robot_2:
#     { axis: y, side: 1 }, robot_3: { axis: x, side: -1 } }, AND
#     grounding_aisle_x_band_m: [-0.46, 0.46] (robot_2's sidestep stays in
#     the N-S aisle); shadow_classical_zones stay []; static_obstacles stay
#     absent and prompt_static_obstacles false: the aperture reaches no text
#     channel (header of isaac/config/scenarios/bottleneck_merge.yaml)
#   priority_urgent_r1 / priority_urgent_r2 (B2 pair, two robots) -> robot_1
#     [2.5, 0.0], robot_2 [-2.5, 0.0] as written, with the member's task
#     labels: _r1 robot_1 { task: urgent_order_delivery, priority: 1 },
#     robot_2 { task: routine_order_delivery }; _r2 robot_1 { task:
#     routine_order_delivery }, robot_2 { task: urgent_order_delivery,
#     priority: 1 } (priority is read by M3 only, never rendered);
#     scenario_geometry as shipped (headers of
#     isaac/config/scenarios/priority_urgent_r{1,2}.yaml)
#   convoy_counterflow (B3, four robots, A55-J gate) -> robot_1 [2.45, -0.36],
#     robot_2 [-2.0, 0.0], AND robot_3: { task: cross_narrow_aisle, goal:
#     [2.45, 0.36], start_delay_sec: 120 }, robot_4: { task:
#     cross_narrow_aisle, goal: [1.85, 0.0], start_delay_sec: 120 }, AND
#     scenario_geometry corridor center_m: 0.0, half_length_m: 0.5, AND
#     config/rag.yaml grounding.mode: legacy (header of
#     isaac/config/scenarios/convoy_counterflow.yaml). robot_1/robot_3
#     lateral raised 0.3 -> 0.36 by the Rev 22 B3 goal-table fix (notes
#     2026-09-30): widest value under this scene's own wall_margin_m
#     discipline (= pull_off_lateral_m, matching robot_2's own parked
#     lateral here). Goal-to-goal separation (0.72 m, was 0.6 m with no
#     headroom vs the 0.45 m floor + 0.15 m margin) is necessary but not the
#     root cause -- the actual failure was robot_3's dynamic release
#     approach, modeled (nominally) and pinned as a closest-point-to-segment
#     check in isaac/config/scenarios/convoy_counterflow.yaml's header
#     (0.549 m nominal at the old stack, below the margin; 0.636 m nominal
#     at this one). The nominal model overstates the real gain: measured VM
#     minima (same header) are 0.463-0.475 m at this stack, clearing the
#     0.45 m floor but not the fuller 0.15 m margin -- see that header for
#     the full measured table and why the margin is not reachable by
#     widening y alone.
#   priority_visual_r1 / priority_visual_r2 (B2-visual pair, two robots) ->
#     robot_1 [2.5, 0.0], robot_2 [-2.5, 0.0] as written, BOTH with task
#     cross_narrow_aisle on BOTH robots in BOTH members (no label differs);
#     NO `priority` key on either robot in either member -- urgency reaches
#     the model only through the image (one robot's load prop); M5 does not
#     set `loaded` (that is a USD/scenario authoring field, not a registry
#     one; the registry carries no urgency signal at all for this pair);
#     scenario_geometry as shipped (headers of
#     isaac/config/scenarios/priority_visual_r{1,2}.yaml)
#   convoy_counterflow_slip (B3 first-to-slip, four robots, A55-J gate) ->
#     identical M5 settings to convoy_counterflow above (same geometry,
#     same goals, same start_delay_sec, same grounding.mode: legacy); only
#     what is SCORED differs (header of
#     isaac/config/scenarios/convoy_counterflow_slip.yaml)
#   loop_detour_permanent / loop_detour_transient (prereg-v2 (b) loop-map
#     wait-vs-detour family, one robot) -> robot_1 { task:
#     cross_narrow_aisle, goal: [2.3, 0.0] } ONLY (no robot_2), AND
#     scenario_geometry reroute_waypoints: [[0.3, 1.2], [1.8, 1.2]] (the
#     far-aisle detour M3 grounds a reroute to; the base mission resumes the
#     goal from the connector top); grounding.mode as shipped (derived); no
#     static_obstacles, prompt_static_obstacles false -- the blocker must
#     reach no text channel (headers of
#     isaac/config/scenarios/loop_detour_{permanent,transient}.yaml;
#     scripts/vm/v2_overlay.py applies exactly this row)
# Running a _gshort or _bshort scenario without changing these dispatches +-2.5
# and the variant silently degrades to its beyond-goal twin, blocker back on
# the goal path (isaac/config/scenarios/family/*_{gshort,bshort}_o0.yaml).
# The _bshort pair is asymmetric on purpose: only the goal that lies past the
# blocker is shortened, so the passer's goal stays beyond the yielder's park
# point (1.789 m) and an arrived passer cannot block the yielder's return.
initial_tasks:
  robot_1: { task: cross_narrow_aisle, goal: [2.5, 0.0] }
  robot_2: { task: cross_narrow_aisle, goal: [-2.5, 0.0] }

# Scene dimensions M3 derives the yield maneuver from. They mirror
# isaac/config/scenarios/head_on_deadlock.yaml (barrier spans x=+-1.0, 0.9 m
# tall), isaac/config/warehouse.yaml (nominal_aisle_width_m 1.2) and
# vgu_sim CameraConfig (camera at z=3.0); keep them in sync by hand until M5
# reads the scenario file directly. A junction scene also declares `arms`
# (robot id -> { axis, side }: the arm that robot approached on, side = the
# arm's outward sign); a listed robot yields along its own arm with the
# corridor's other dimensions. Absent (as shipped), every robot uses `corridor`.
scenario_geometry:
  corridor: { axis: x, center_m: 0.0, half_length_m: 1.0, aisle_half_width_m: 0.6, occluder_height_m: 0.9 }
  camera: { height_m: 3.0, marker_height_m: 0.21 }
  robot: { half_width_m: 0.09, marker_half_size_m: 0.06, safety_radius_m: 0.45 }
  park_margin_m: 0.4  # 0.3 lost the marker for 7.6s after the side-step; 0.4 verified clean (2026-09-16)
  wall_margin_m: 0.15
  passer_margin_m: 0.2

# Whether M3 may ground a yield to a robot other than the one M2 named, when
# the named one cannot physically reach its park point:
#   off    - ground the named yielder verbatim (default; every decision
#            artifact collected so far was produced this way)
#   swap   - re-ground the yield to a feasible involved robot, recording
#            yield_robot_grounded_from in the command; refuse if none is
#   refuse - never swap; degrade to a temporary_wait instead
# The gate reads scenario_geometry AND static_obstacles below. static_obstacles
# ships commented out, so leaving it that way makes this key a no-op whatever
# it is set to. Quoted because bare `off` is YAML 1.1 boolean false.
grounding_yield_feasibility: "off"

# M3 grounding parameters: the `grounding:` section of this file, whose `mode`
# (legacy | derived) is the single switch for derived grounding. Loaded once at
# startup; a missing file or an invalid section stops M5.
grounding_params_path: "config/rag.yaml"
# Per-scenario world-frame y band [low, high] that every retreat candidate's
# swept path must stay inside (derived mode), replacing the grounding file's
# aisle_y_band_m. Like scenario_geometry above it is scenario geometry and must
# be set per scenario by hand; null keeps the file's value, which lets the
# declared aisle bound the sidestep (k = 2 on the head-on family). Recorded in
# every artifact as grounding_params_source.aisle_y_band_override_m.
grounding_aisle_y_band_m: null
# Per-scenario world-frame x band [low, high] for a yielder whose declared
# junction arm runs along y (scenario_geometry.arms axis: y): the N-S aisle's
# walls, which the default band centred on the yielder's own x does not know.
# Every other yielder ignores it; null (every scene but bottleneck_merge)
# changes nothing. Recorded as grounding_params_source.aisle_x_band_override_m.
grounding_aisle_x_band_m: null
# Stage-2 retreat selection (derived mode, yields only): a second VLM call picks
# one of the validated retreat candidates. false skips the call and every yield
# grounds the geometry-max candidate (tagged retreat=default:no_choice). With
# the mock backend, stage 2 answers only when VGU_MOCK_RETREAT_CHOICE_FILE names
# a script (e.g. config/mock_decisions/retreat_choice_b.json); otherwise the
# call is skipped and recorded as skip_reason=no_backend.
stage2_retreat_selection: true
# M1's calibration, used to draw each stage-2 candidate's letter on a copy of
# the stage-1 frame (<request_id>_stage2.png, set-of-mark). null uses the file
# M1 launches with (swarm_perception share config/calibration.yaml). A missing
# or invalid file never stops M5: stage 2 then gets the unmarked frame, its
# prompt says the letters are not drawn, and the artifact records
# stage2.marks_drawn: false with the reason.
stage2_calibration_path: null
# Stage-2 call budget, in place of the stage-1 reasoner block's (openai there
# is 4 attempts x 120 s). Worst case 2 x 8 s = 16 s, inside one
# command_timeout_sec (20 s) while the deadlocked robots wait on it; 8 s
# clears every stage-1 call measured so far (gpt-4o 2.1-6.0 s, ER-2
# 3.2-3.8 s) for a shorter prompt and a one-letter answer. Timeouts, backend
# errors, refusals and unparsable text each spend an attempt.
stage2_max_attempts: 2
stage2_timeout_sec: 8.0

# Arm B shadow (rev-8 shadow logging): on every VLM analysis, also compute the
# classical answer from a snapshot ring buffer and write it, with the Arm A vs
# Arm B disagreement flags, to the decision artifact's shadow_classical block.
# Observational only: it never dispatches or changes the VLM decision, and a
# failure inside it is recorded as shadow_error. Thresholds come from the
# `classical:` section of shadow_classical_params_path; a missing file or
# section is recorded per analysis, an invalid one stops M5 at startup.
shadow_classical: true
shadow_classical_params_path: "config/rag.yaml"
# Ring buffer in M1 stamp seconds: must exceed stall_threshold_sec so zone
# entries are still buffered at trigger time; the sample period must stay below
# classical arrival_tie_sec (1.0 s) or FCFS is quantized at its tie scale.
shadow_classical_window_sec: 60.0
shadow_classical_sample_period_sec: 0.25
# Mapped conflict zones for Arm B's intersection rule, per scenario (later
# tiers). Empty for head-on scenarios: that rule derives its own pair zone.
# Set per scenario by hand like initial_tasks (goal table above), and keep it
# empty otherwise: a zone left over at the origin would let the intersection
# rule fire on any scene with two stopped robots whose goal axes cross near
# the centre. intersection_bottleneck (T1) declares:
#   - { zone_id: crossing_1, x: 0.0, y: 0.0, radius_m: 1.5 }
shadow_classical_zones: []

# T0 negative control (log-only probes): every t0_probe_interval_sec, run the
# VLM analysis off-trigger on the latest scene and record it (artifact marked
# probe: true, log line reason=t0_probe). Probes can never be grounded or
# dispatched. On only for T0 normal_flow runs (set that scenario's goals in
# initial_tasks above). t0_probe_max_probes: 0 = unlimited.
t0_probe_mode: false
t0_probe_interval_sec: 20.0
t0_probe_max_probes: 0
# Defer a probe when the latest SceneState arrived more than this many wall
# seconds ago: after Isaac exits, scene and frame stamps freeze together, so
# only the receipt age stops probes re-analysing the final frozen scene.
t0_probe_max_snapshot_age_sec: 3.0

# (a0) universal proposed_plan channel (prereg-v2 rev 4, build-order step 4).
# false (default): the dispatch path -- grounded command, prompt version
# (v2), decision artifact -- is byte-identical to every run before this
# channel existed; this is the regression gate the two-robot head-on
# equivalence smoke runs against. true: every triggered analysis is also
# verified/repaired via `verify_and_repair_plan` and tracked by
# `PlanTracker` (plan_id, per-leg pending/active/done/failed status,
# dependency-ordered supersession cancels); dispatched actions carry the
# accepted plan_id, M5 renders prompt v3 (the plan-state block plus the
# `proposed_plan` invitation) instead of v2, and the decision artifact gains
# a `plan` block. Never enabled for a T0 log-only probe (the probe path
# never grounds or dispatches, so there is nothing to track).
plan_channel_enabled: false

# prereg-v3 R3.3 arm (dispatch-model-order-when-verified): where a
# junction_clear resolution's RECEDE dispatch order comes from.
#   chi                 - always the chi ranking (default; the inherited
#                         behaviour, byte-identical dispatch)
#   model_when_verified - the model's own proposed_plan recede order when
#                         that plan verified vlm_verbatim (order within the
#                         chi-epsilon rule); repaired / m3_default plans and
#                         every non-junction strategy stay on chi
# Recede set, pockets (chi-rank), cross and release are unchanged either way.
# Recorded in every decision artifact (plan_dispatch_order_source, plus the
# per-decision dispatch_order_source). model_when_verified needs the plan
# channel above switched on; M5 refuses to start otherwise.
plan_dispatch_order_source: "chi"

# prereg-v3 R3.4 contradiction trigger (closed-loop item). false (default):
# nothing is armed or fired and no artifact gains a key -- byte-identical to
# every run before this block existed. true: while a dispatched command is in
# flight, a leg M4 reports FAILED, or a robot measurably departing from what
# its leg implies (yield: distance to the grounded park/retreat target rises
# more than divergence_bound_m above its running minimum; reverse: travel
# exceeds backup_distance_m + divergence_bound_m; a temporary_wait in a
# command with no yield/reverse leg: travel exceeds divergence_bound_m; each
# measured from the robot's first M1 position after the leg turned ACTIVE),
# arms an early re-analysis. It fires once, when that command resolves,
# skipping the remaining cooldown and the stall timer -- never mid-maneuver
# (M4 rejects a second command for a busy robot) and never for the
# exhausted-robots set. At most per_event_replan_budget early re-analyses per
# congestion episode. reroute legs and every junction_clear phase command are
# never watched. Every triggered artifact records trigger_source
# (stall | contradiction | manual).
contradiction_trigger:
  enabled: false
  divergence_bound_m: 0.5
  per_event_replan_budget: 1
# prereg-v3 R3.4 failure-explanation line: append one classically derived
# "Cause: ..." sentence (leg statuses, M3 refusals/degradations, arrival
# rejections; never model text) to each failure-context block's detail.
# false (default) keeps every prompt byte-identical.
failure_explanation_enabled: false
# v3 dispatch-off probe flag (S4/S5/S6 log-only scoring): false runs every
# triggered analysis through M2 and M3 and writes the full artifact, plus
# dispatch_enabled: false / dispatch_suppressed, but publishes nothing to M4,
# starts no junction phase queue and records no attempt; a cooldown_sec
# cooldown starts instead. Not t0_probe_mode, which only runs off-trigger
# stage-1 probes.
dispatch_enabled: true
# v3 S1 (MAPD-5) task stream; default off (the registry holds initial_tasks).
# Enabled, each initial_tasks robot works a seeded FIFO queue of
# tasks_per_robot nodes; its registry goal stays the node through the accepted
# arrival and dwell_sim_sec (sim-s, M1 stamps) and pops to the next node at
# dwell end. Robot k (natural id order) is held k x release_stagger_wall_sec
# (wall-s: 4 sim-s / RTF_pilot). Events + manifest go to
# <decision_log_dir>/tasks_<session_id>.jsonl. S1 values, for reference:
#   nodes: { Wp: [-2.3, 0.35], Wm: [-2.3, -0.35], N: [0.0, 1.55],
#            S: [0.0, -1.55], E: [2.3, 0.0] }
#   forbidden_legs: [[Wp, Wm]]   tasks_per_robot: 5   dwell_sim_sec: 5.0
#   horizon_sim_sec: 600.0       seed: <from the registered 100-seed list>
task_stream:
  enabled: false

# v4 per-cluster choice, Stage 1 live shadow (exploratory cells only: a second
# billed M2 call per analysis, never in a pinned v3 cell). Enabled, each
# triggered analysis is followed, after its ordinary outcome is dispatched, by
# the grounding_first_per_cluster call on the same request and frame, run on
# its own worker; the record replaces the `per_cluster_shadow: pending` block
# of that analysis's decision artifact. It never dispatches and never changes
# M5 state. Set keep_debug_frames: true with it so the frames survive.
#   max_attempts / call_timeout_sec: null inherits the ordinary reasoner's.
#   timeout_sec: wall-clock bound on one whole shadow, from its submit.
#   max_backlog: shadows still running when a new one is due; past it the new
#     one is skipped and recorded.
#   event_trace: <decision_log_dir>/trigger_trace_<session_id>.jsonl, every
#     congestion event's directive with the in-flight commands.
per_cluster_shadow:
  enabled: false
  max_attempts: null
  call_timeout_sec: null
  timeout_sec: 300.0
  max_backlog: 1
  include_wait: true
  option_ids: numbered
  event_trace: true

# Fixed obstacles rendered into the VLM prompt when prompt_static_obstacles is
# true. Like scenario_geometry above, these mirror the scenario file by hand
# (here the head-on asymmetric family blocker) and must be set per scenario —
# a list left over from another scenario describes a scene that is not there.
# Uncomment together with prompt_static_obstacles: true.
#
# The ids are rendered verbatim into the VLM prompt, so they are deliberately
# neutral and must stay that way: an id naming the object's role or side (the
# scenario yaml's blocker_west) would tell the model both that the box is an
# obstruction and which side it obstructs — exactly the inference the experiment
# measures. Do NOT sync these ids to the scenario yaml's descriptive names; that
# file is Isaac-side and never reaches the prompt. Only the geometry is mirrored.
# static_obstacles:
#   - { obstacle_id: obstacle_1, x: -1.85, y: 0.0, size_x_m: 0.3, size_y_m: 0.3 }
