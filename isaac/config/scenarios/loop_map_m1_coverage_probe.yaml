schema_version: 1
name: loop_map_m1_coverage_probe
family: normal_flow
seed: 42
duration_sec: 120.0

# v2 build-order step 8, Phase 1 bonus probe (not required for the GO
# verdict in docs/reports/2026-10-02-loop-preemption-smoke.md Section 3,
# which clears the geometry by computation; this closes the one residual
# that section flags empirically, the same way
# docs/reports/2026-10-01-m1-y-extent-verification.md closed the |y|~=1.2
# requirement). Both robots held STATIONARY for the full dwell (huge
# start_delay_sec patched into orchestrator.yaml, the m1_y_extent_probe
# technique -- M5 never dispatches a goal, so no Nav2 motion and no
# congestion is ever possible: family normal_flow, expected_conflict null).
#
# Points probed (report Section 3, camera-occlusion model):
#   - robot_1 at (1.4, 1.2): the second aisle's centreline, representative of
#     a normal transit of the carved aisle.
#   - robot_2 at (1.8, 1.0): near the connector's mouth into the second
#     aisle, 0.041 m north of the computed shadow boundary (0.959) from the
#     lowered (0.3 m) connector-flanking rack remnant -- the tightest
#     still-should-be-clear point the analysis identifies, not the
#     residual shadow sliver itself (y in [0.925, 0.959], unreachable by
#     the robot's own 0.09 m half-width footprint on any path that keeps it
#     inside the carved aisle).
#
# Both points sit inside the verified-clean tracked band (|x|<=2.5,
# |y|<=2.0); robot_2 additionally reuses marker_id 2, avoiding the
# registered robot_1/marker_id 1 STALE point (x=-1.75, y=0, yaw=0), which is
# nowhere near either probe point anyway.
#
# M5 takes goals from swarm_orchestrator/config/orchestrator.yaml
# initial_tasks, NOT from here: both robots need start_delay_sec far beyond
# duration_sec (scripts/vm/patch_initial_tasks.py, restored after the run).
robots:
  - robot_id: robot_1
    marker_id: 1
    spawn: {x: 1.4, y: 1.2, yaw_rad: 0.0}
    goal: {x: 1.4, y: 1.2}
    initial_task: hold_position
  - robot_id: robot_2
    marker_id: 2
    spawn: {x: 1.8, y: 1.0, yaw_rad: 0.0}
    goal: {x: 1.8, y: 1.0}
    initial_task: hold_position

loop_map:
  second_aisle_center_y_m: 1.2
  second_aisle_width_m: 0.55
  second_aisle_x_min_m: 0.6
  second_aisle_x_max_m: 2.2
  connector_center_x_m: 1.8
  connector_width_m: 0.55
  connector_remnant_height_m: 0.3

aisle_barrier: null
timed_obstacles: []
static_obstacles: []

expected_conflict: null

runtime:
  physics_hz: 60
  rendering_hz: 30
